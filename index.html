<html lang="en">

<head>

    <meta property="og:title" content="Cfstats — Counter Flame Statistics Analyzer">

    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js" defer onerror="window.__tessFail=true"></script>
    <style>
        :root {
          --bg: #060606;
          --surface: #0c0c0c;
          --surface-2: #121212;
          --surface-3: #1a1a1a;
          --border: #242424;
          --border-strong: #3d3d3d;
          --text: #f2f2f2;
          --muted: #9b9b9b;
          --faint: #5f5f5f;
          --accent: #ffffff;
          --radius-sm: 6px;
          --radius-md: 10px;
          --radius-lg: 14px;
          --font-display: 'Cabinet Grotesk', 'Arial Black', sans-serif;
          --font-body: 'General Sans', 'Helvetica Neue', sans-serif;
          --font-mono: 'JetBrains Mono', 'Courier New', monospace;
          --text-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.875rem);
          --text-sm: clamp(0.875rem, 0.8rem + 0.35vw, 1rem);
          --text-base: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
          --text-lg: clamp(1.125rem, 1rem + 0.75vw, 1.5rem);
          --text-xl: clamp(1.5rem, 1.2rem + 1.25vw, 2.25rem);
          --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem; --space-4: 1rem; --space-5: 1.25rem;
          --space-6: 1.5rem; --space-8: 2rem; --space-10: 2.5rem; --space-12: 3rem; --space-16: 4rem;
          --transition: 180ms cubic-bezier(0.16, 1, 0.3, 1);
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { -webkit-text-size-adjust: none; text-size-adjust: none; -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }
        body {
          min-height: 100dvh;
          line-height: 1.6;
          font-family: var(--font-body);
          font-size: var(--text-base);
          color: var(--text);
          background-color: var(--bg);
          background-image:
            repeating-linear-gradient(0deg, transparent 0 3px, rgba(255,255,255,0.012) 3px 4px);
        }
        img, svg, canvas { display: block; max-width: 100%; }
        button, input, select { font: inherit; color: inherit; }
        button { cursor: pointer; background: none; border: none; }
        :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
        .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
        
        .wrap { max-width: 1080px; margin: 0 auto; padding: 0 var(--space-6); }
        
        /* header */
        header { border-bottom: 1px solid var(--border); }
        .header-inner { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); padding: var(--space-4) var(--space-6); flex-wrap: wrap; box-sizing: border-box; }
        .brand { display: flex; align-items: baseline; gap: var(--space-3); }
        .wordmark { font-family: var(--font-display); font-weight: 800; font-size: var(--text-lg); letter-spacing: 0.06em; }
        .wordmark .cf { color: var(--text); }
        .tagline { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--muted); letter-spacing: 0.04em; }
        .lang-switch { display: flex; border: 1px solid var(--border-strong); border-radius: var(--radius-full); overflow: hidden; }
        .lang-switch button {
          font-family: var(--font-mono); font-size: var(--text-xs); padding: var(--space-2) var(--space-3);
          color: var(--muted); letter-spacing: 0.06em; transition: color var(--transition), background var(--transition);
        }
        .lang-switch button + button { border-left: 1px solid var(--border-strong); }
        .lang-switch button[aria-current="true"] { background: var(--accent); color: #000; font-weight: 700; }
        
        /* hero */
        .hero { padding: var(--space-12) 0 var(--space-8); display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: var(--space-10); align-items: start; }
        .kicker { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--muted); letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: var(--space-3); }
        .hero h1 { font-family: var(--font-display); font-weight: 800; font-size: var(--text-xl); line-height: 1.1; letter-spacing: -0.01em; margin-bottom: var(--space-4); }
        .hero p { color: var(--muted); max-width: 52ch; }
        .hero .score-scale { margin-top: var(--space-6); }
        
        /* how it works */
        .how { border: 1px solid var(--border); border-radius: var(--radius-lg); padding: var(--space-6); background: var(--surface); }
        .how h2 { font-family: var(--font-display); font-size: var(--text-lg); font-weight: 700; margin-bottom: var(--space-5); }
        .how ol { list-style: none; display: grid; gap: var(--space-4); }
        .how li { display: grid; grid-template-columns: 2.2rem 1fr; gap: var(--space-3); }
        .how .num { font-family: var(--font-mono); color: var(--muted); border: 1px solid var(--border-strong); border-radius: var(--radius-sm); width: 2.2rem; height: 2.2rem; display: flex; align-items: center; justify-content: center; font-size: var(--text-sm); }
        .how strong { display: block; font-weight: 600; font-size: var(--text-base); }
        .how span { color: var(--muted); font-size: var(--text-sm); }
        
        /* score scale */
        .scale { display: flex; flex-wrap: wrap; gap: var(--space-2); font-family: var(--font-mono); font-size: var(--text-xs); }
        .scale span { border: 1px solid var(--border-strong); border-radius: var(--radius-full); padding: var(--space-1) var(--space-3); color: var(--muted); }
        .scale b { color: var(--text); font-weight: 500; }
        
        /* main card */
        .card { border: 1px solid var(--border-strong); border-radius: var(--radius-lg); background: var(--surface); overflow: hidden; }
        .card-head { display: flex; align-items: center; justify-content: space-between; padding: var(--space-4) var(--space-6); border-bottom: 1px solid var(--border); gap: var(--space-4); flex-wrap: wrap; }
        .card-head h2 { font-family: var(--font-display); font-weight: 700; font-size: var(--text-lg); }
        .card-body { padding: var(--space-6); }
        
        /* dropzone */
        .dropzone {
          border: 1.5px dashed var(--border-strong); border-radius: var(--radius-md);
          padding: var(--space-10) var(--space-6); text-align: center; cursor: pointer;
          transition: border-color var(--transition), background var(--transition);
        }
        .dropzone:hover, .dropzone.drag { border-color: var(--accent); background: var(--surface-2); }
        .dz-icon { margin: 0 auto var(--space-4); width: 3rem; height: 3rem; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border-strong); border-radius: var(--radius-full); }
        .dz-title { font-weight: 600; margin-bottom: var(--space-2); }
        .dz-sub { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--muted); letter-spacing: 0.03em; }
        .dz-privacy { display: flex; align-items: center; gap: var(--space-2); justify-content: center; margin-top: var(--space-5); color: var(--faint); font-size: var(--text-xs); }
        .thumb-row { display: flex; align-items: center; gap: var(--space-4); margin-bottom: var(--space-5); }
        .thumb-row img { max-height: 110px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); }
        
        /* processing */
        .log { font-family: var(--font-mono); font-size: var(--text-sm); display: grid; gap: var(--space-2); }
        .log .line { display: flex; gap: var(--space-3); color: var(--muted); }
        .log .line::before { content: '>'; color: var(--faint); }
        .log .line.done { color: var(--text); }
        .log .line.active { color: var(--text); animation: blink 1.2s steps(2) infinite; }
        @keyframes blink { 50% { opacity: 0.45; } }
        .progress { height: 3px; background: var(--surface-3); border-radius: var(--radius-full); overflow: hidden; margin-top: var(--space-5); }
        .progress i { display: block; height: 100%; background: var(--accent); width: 0%; transition: width 300ms ease; }
        
        /* errors */
        .error-box { display: flex; gap: var(--space-4); align-items: flex-start; border: 1px solid var(--border-strong); border-left: 3px solid var(--accent); border-radius: var(--radius-sm); padding: var(--space-4) var(--space-5); background: var(--surface-2); }
        .error-box p { font-size: var(--text-sm); }
        .error-box .btn-row { margin-top: var(--space-4); }
        
        /* review grid */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-4); margin-bottom: var(--space-6); }
        .field label { display: block; font-family: var(--font-mono); font-size: var(--text-xs); color: var(--muted); letter-spacing: 0.04em; margin-bottom: var(--space-2); }
        .field input {
          width: 100%; background: var(--surface-2); border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
          padding: var(--space-3); font-family: var(--font-mono); font-size: var(--text-base); color: var(--text);
          transition: border-color var(--transition);
        }
        .field input:focus { outline: none; border-color: var(--accent); }
        .field.uncertain input { border-style: dashed; }
        .field .hint { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--faint); margin-top: var(--space-1); }
        .btn-row { display: flex; gap: var(--space-3); flex-wrap: wrap; }
        .btn { display: inline-flex; align-items: center; gap: var(--space-2); font-weight: 600; font-size: var(--text-sm); padding: var(--space-3) var(--space-6); border-radius: var(--radius-sm); border: 1px solid var(--border-strong); transition: all var(--transition); }
        .btn:hover { border-color: var(--accent); }
        .btn-primary { background: var(--accent); color: #000; border-color: var(--accent); }
        .btn-primary:hover { background: #d8d8d8; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        
        /* result */
        .result-grid { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: var(--space-8); align-items: start; }
        .gauge-box { text-align: center; }
        .gauge { position: relative; width: 240px; height: 240px; margin: 0 auto; }
        .gauge svg { transform: rotate(-90deg); }
        .gauge .track { stroke: var(--surface-3); }
        .gauge .arc { stroke: var(--accent); transition: stroke-dashoffset 1.2s cubic-bezier(0.16, 1, 0.3, 1); }
        .gauge .num { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; }
        .gauge .num .scoreline { display: flex; align-items: baseline; justify-content: center; gap: 3px; }
        .gauge .num b { font-family: var(--font-mono); font-weight: 700; font-size: 3.4rem; line-height: 1; letter-spacing: -0.02em; }
        .gauge .num .pct { font-family: var(--font-mono); font-size: 1.5rem; color: var(--muted); }
        .gauge .num > span { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--muted); letter-spacing: 0.14em; text-transform: uppercase; margin-top: var(--space-2); }
        .verdict { margin-top: var(--space-5); }
        .verdict h3 { font-family: var(--font-display); font-weight: 800; font-size: var(--text-lg); }
        .verdict p { color: var(--muted); font-size: var(--text-sm); margin-top: var(--space-2); }
        .verdict .gnote { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--faint); margin-top: var(--space-3); }
        .checks { display: grid; gap: var(--space-3); }
        .check { display: grid; grid-template-columns: 4.6rem 1fr; gap: var(--space-4); align-items: start; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: var(--space-4); background: var(--surface-2); }
        .check .status { font-family: var(--font-mono); font-size: var(--text-xs); letter-spacing: 0.1em; padding: var(--space-1) 0; text-align: center; border-radius: var(--radius-sm); border: 1px solid var(--border-strong); color: var(--muted); }
        .check.pass .status { border-color: var(--accent); color: var(--text); }
        .check.fail .status { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 700; }
        .check .body strong { display: block; font-size: var(--text-sm); font-weight: 600; }
        .check .body p { font-size: var(--text-sm); color: var(--muted); margin-top: var(--space-1); }
        .check .body .w { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--faint); }
        .check.na { opacity: 0.55; }
        .disclaimer { margin-top: var(--space-6); border: 1px solid var(--border-strong); border-radius: var(--radius-sm); padding: var(--space-4) var(--space-5); background: var(--surface-2); display: flex; gap: var(--space-4); }
        .disclaimer .ic { flex-shrink: 0; }
        .disclaimer p { font-size: var(--text-sm); color: var(--muted); }
        .disclaimer strong { color: var(--text); display: block; margin-bottom: var(--space-1); font-size: var(--text-sm); }
        
        footer { border-top: 1px solid var(--border); margin-top: var(--space-16); padding: var(--space-6) 0 var(--space-10); }
        footer p { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--faint); letter-spacing: 0.03em; }
        footer .credit { margin-top: var(--space-2); }
        footer .credit b { color: var(--muted); font-weight: 500; }
        
        /* ============ background particles ============ */
        #bg-particles { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none; }
        /* foreground overlay for the verdict burst (above the card) */
        #fx-overlay { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 50; pointer-events: none; }
        
        /* ============ animations ============ */
        @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
        @keyframes popIn { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
        @keyframes floaty { 0%, 100% { transform: translateY(-4px); } 50% { transform: translateY(4px); } }
        @keyframes sweep { to { background-position: 200% 0; } }
        @keyframes scan { 0% { top: -46px; } 100% { top: 100%; } }
        @keyframes glowPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); } 50% { box-shadow: 0 0 26px 2px rgba(255,255,255,0.07); } }
        
        header { animation: fadeUp .5s both; }
        .hero .kicker { animation: fadeUp .55s .05s both; }
        .hero h1 { animation: fadeUp .55s .12s both; }
        .hero p { animation: fadeUp .55s .2s both; }
        .hero .score-scale { animation: fadeUp .55s .28s both; }
        .how { animation: fadeUp .6s .22s both; }
        .how li { animation: fadeUp .5s both; }
        .how li:nth-child(1) { animation-delay: .32s; }
        .how li:nth-child(2) { animation-delay: .42s; }
        .how li:nth-child(3) { animation-delay: .52s; }
        .card { animation: fadeUp .6s .34s both; }
        footer p { animation: fadeUp .6s .5s both; }
        
        /* dropzone life */
        .dz-icon { animation: floaty 3.6s ease-in-out infinite; border-color: var(--border-strong); }
        .dropzone:hover, .dropzone.drag { box-shadow: inset 0 0 30px rgba(255,255,255,0.03); animation: glowPulse 2.4s ease-in-out infinite; }
        
        /* buttons */
        .btn { transition: transform var(--transition), border-color var(--transition), background var(--transition), box-shadow var(--transition); }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(255,255,255,0.07); }
        .btn:active { transform: translateY(0) scale(0.98); }
        
        /* scale tags */
        .scale span { transition: transform var(--transition), border-color var(--transition), color var(--transition); }
        .scale span:hover { transform: translateY(-2px); border-color: var(--accent); color: var(--text); }
        .scale span:nth-child(1) b { color: #34d399; }
        .scale span:nth-child(2) b { color: #a3e635; }
        .scale span:nth-child(3) b { color: #fbbf24; }
        .scale span:nth-child(4) b { color: #ef4444; }
        
        /* progress shimmer */
        .progress i { background-image: linear-gradient(90deg, var(--accent), #8a8a8a, var(--accent)); background-size: 200% 100%; animation: sweep 1.4s linear infinite; }
        
        /* processing thumbnail scanline (my addition) */
        .thumb-wrap { position: relative; display: inline-block; overflow: hidden; border-radius: var(--radius-sm); }
        .thumb-wrap img { max-height: 110px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); }
        .thumb-wrap .scanline {
          position: absolute; left: 0; right: 0; height: 42px; pointer-events: none;
          background: linear-gradient(180deg, transparent, rgba(255,255,255,0.16), transparent);
          animation: scan 2.1s cubic-bezier(0.45, 0, 0.55, 1) infinite;
        }
        
        /* review fields stagger */
        .stats-grid .field { animation: fadeUp .5s both; }
        .stats-grid .field:nth-child(1) { animation-delay: .03s; }
        .stats-grid .field:nth-child(2) { animation-delay: .08s; }
        .stats-grid .field:nth-child(3) { animation-delay: .13s; }
        .stats-grid .field:nth-child(4) { animation-delay: .18s; }
        .stats-grid .field:nth-child(5) { animation-delay: .23s; }
        .stats-grid .field:nth-child(6) { animation-delay: .28s; }
        .stats-grid .field:nth-child(7) { animation-delay: .33s; }
        .stats-grid .field:nth-child(8) { animation-delay: .38s; }
        
        /* result view */
        .gauge-box { animation: popIn .55s .1s both; }
        .verdict { animation: fadeUp .5s .25s both; }
        .check { animation: fadeUp .45s both; }
        .check .status { transition: color var(--transition), border-color var(--transition), background var(--transition); }
        .check.pass .status { color: #34d399; border-color: rgba(52, 211, 153, 0.45); }
        .check.fail .status { background: #b91c1c; border-color: #b91c1c; color: #fff; font-weight: 700; }
        .disclaimer { animation: fadeUp .5s .3s both; }
        
        /* score-colored gauge */
        .gauge .arc { transition: stroke-dashoffset 1.2s cubic-bezier(0.16, 1, 0.3, 1), stroke .7s ease; }
        .gauge .num b { transition: color .7s ease; }
        .verdict h3 { transition: color .7s ease; }
        
        [hidden]
